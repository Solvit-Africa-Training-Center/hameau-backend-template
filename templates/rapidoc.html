<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script type="module" src="https://unpkg.com/rapidoc/dist/rapidoc-min.js"></script>
    <style>
      rapi-doc::part(section-navbar) {
        background: linear-gradient(180deg, #0f172a, #1e293b);
        border-right: 1px solid #334155;
        padding-top: 20px;
      }

      rapi-doc::part(nav-item) {
        margin: 4px 12px;
        border-radius: 8px;
        transition: all 0.2s ease;
      }

      rapi-doc::part(nav-item-active) {
        background-color: rgba(56, 189, 248, 0.1);
        border-left: 4px solid #38bdf8;
      }

      rapi-doc::part(label-method-get) { color: #34d399; }
      rapi-doc::part(label-method-post) { color: #fbbf24; }
      rapi-doc::part(label-method-delete) { color: #f87171; }

      rapi-doc::part(section-operations) {
        padding: 40px;
      }
    </style>
  </head>
  <body>
    <rapi-doc 
      spec-url="/swagger.json" 
      render-style="focused" 
      theme="dark" 
      bg-color="#0f172a" 
      text-color="#f8fafc"
      primary-color="#38bdf8"
      nav-bg-color="#0f172a"
      nav-item-spacing="relaxed" 
      show-header="false"
      allow-spec-file-load="false"
      allow-server-selection="true"
      schema-style="table"
    >
      <div slot="nav-logo" style="display:flex; align-items:center; padding: 0 20px;">
        <span style="color:#38bdf8; font-size:24px; font-weight:bold; font-family:sans-serif;">
          SOLVIT HAMEAU<small style="font-size:12px; color:#94a3b8">DOCS</small>
        </span>
      </div>
    </rapi-doc>
  </body>
</html>
